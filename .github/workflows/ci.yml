name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (showcase)
        run: pnpm --filter @collective/showcase build

      - name: Validate token JSONs
        run: |
          for f in packages/*/llm/tokens.json; do
            jq empty "$f" || exit 1
          done

      - name: Validate component manifests
        run: |
          for f in packages/*/llm/components.json; do
            jq empty "$f" || exit 1
          done
